# Model catalog: the ONLY place model IDs, endpoints and prices live.
# Sources (checked 2026-11-04):
#   Anthropic model IDs and prices: Claude API docs (models overview / pricing).
#   fal.ai endpoints and prices: fal.ai model pages + "best image-to-video APIs 2026".
# Re-verify before relying on prices for anything beyond the run budget guard.
# Rationale per node: docs/adr/0007-model-selection-per-node.md

default_profile = "balanced"

# ---------------------------------------------------------------- profiles
# Each node -> { model, effort }. effort: low | medium | high | xhigh | max

[profiles.fast]
understand     = { model = "claude-haiku-5-5",  effort = "low" }
insight        = { model = "claude-sonnet-5-5", effort = "low" }
ideate         = { model = "claude-sonnet-5-5", effort = "low" }
select         = { model = "claude-haiku-5-5",  effort = "low" }
storyboard     = { model = "claude-sonnet-5-5", effort = "low" }
continuity     = { model = "claude-haiku-5-5",  effort = "medium" }
prompt_writer  = { model = "claude-sonnet-5-5", effort = "low" }
edit_parser    = { model = "claude-haiku-5-5",  effort = "low" }
conflict_check = { model = "claude-haiku-5-5",  effort = "medium" }
policy_rewrite = { model = "claude-sonnet-5-5", effort = "low" }
qa_critic      = { model = "claude-sonnet-5-5", effort = "low" }
endcard_copy   = { model = "claude-haiku-5-5",  effort = "low" }

[profiles.balanced]
# understand: low (3.5 s median vs 5.7 s at medium, same brief quality). ideate: high on purpose,
# because medium/low regressed to category clichés at ~21 s. Measurements in ADR-0007.
understand     = { model = "claude-haiku-5-5",  effort = "low" }
# insight: the truths the concepts stand on; high effort for the same reason as ideate.
insight        = { model = "claude-sonnet-5-5", effort = "high" }
ideate         = { model = "claude-sonnet-5-5", effort = "high" }
select         = { model = "claude-sonnet-5-5", effort = "medium" }
storyboard     = { model = "claude-sonnet-5-5", effort = "high" }
continuity     = { model = "claude-sonnet-5-5", effort = "medium" }
prompt_writer  = { model = "claude-sonnet-5-5", effort = "medium" }
edit_parser    = { model = "claude-haiku-5-5",  effort = "medium" }
conflict_check = { model = "claude-sonnet-5-5", effort = "medium" }
policy_rewrite = { model = "claude-sonnet-5-5", effort = "medium" }
qa_critic      = { model = "claude-sonnet-5-5", effort = "medium" }
endcard_copy   = { model = "claude-haiku-5-5",  effort = "medium" }

[profiles.quality]
understand     = { model = "claude-sonnet-5-5", effort = "medium" }
insight        = { model = "claude-opus-5-5",   effort = "high" }
ideate         = { model = "claude-opus-5-5",   effort = "high" }
select         = { model = "claude-sonnet-5-5", effort = "high" }
storyboard     = { model = "claude-opus-5-5",   effort = "high" }
continuity     = { model = "claude-sonnet-5-5", effort = "high" }
prompt_writer  = { model = "claude-sonnet-5-5", effort = "high" }
edit_parser    = { model = "claude-sonnet-5-5", effort = "medium" }
conflict_check = { model = "claude-sonnet-5-5", effort = "high" }
policy_rewrite = { model = "claude-sonnet-5-5", effort = "medium" }
qa_critic      = { model = "claude-opus-5-5",   effort = "medium" }
endcard_copy   = { model = "claude-sonnet-5-5", effort = "medium" }

# ---------------------------------------------------------------- OpenAI
# Intentionally left empty: set from https://platform.openai.com/docs/models
# before using ADSMITH_LLM_PROVIDER=openai. We do not hardcode IDs from memory.
[openai]
default_model = ""
vision_model = ""

# ---------------------------------------------------------------- LLM models
# Prices in USD per 1M tokens. cache_write = 5-minute TTL write (1.25x input); cache_read per docs
# (0.1x input; 0.05x on Opus 5.5). server_fallback = supports `fallbacks: "default"` on refusal
# (beta server-side-fallback-2026-07-01). Haiku 5.5 has no server-side fallback.
[llm_models."claude-opus-5-5"]
input = 4.00
output = 20.00
cache_write = 5.00
cache_read = 0.20
server_fallback = true

[llm_models."claude-sonnet-5-5"]
input = 2.00
output = 10.00
cache_write = 2.50
cache_read = 0.20
server_fallback = true

[llm_models."claude-haiku-5-5"]
input = 0.10
output = 0.50
cache_write = 0.125
cache_read = 0.01
server_fallback = false

# ---------------------------------------------------------------- fal.ai
# Verified 2026-11-04 (M11), nothing from memory:
#   request/response schemas: https://fal.ai/api/openapi/queue/openapi.json?endpoint_id=<endpoint>
#   prices: fal Platform API GET https://api.fal.ai/v1/models/pricing?endpoint_id=<endpoint>
#           (authenticated with this account's key). Where a model page disagrees with the
#           pricing API we budget with the HIGHER figure, so the ledger overestimates spend:
#     LTX-2.3 Fast: API $0.06/s (page header $0.06/s 1080p; page table says $0.04/s).
#     Kling v3 Pro: API $0.14/s (page: $0.112/s audio off, $0.168/s audio on).
#     FLUX.1 dev:   API $0.025/megapixel; page: "billed by rounding up to the nearest megapixel".
[fal.image]
default = "flux_dev"
# Image + prompt → image, for keyframes that show the product (locked product reference).
reference = "kontext_pro"
composite = "kontext_multi"

[fal.image.endpoints.flux_dev]
endpoint = "fal-ai/flux/dev"
usd_per_megapixel = 0.025
round_up_megapixels = true
params = { num_inference_steps = 28, num_images = 1 }

[fal.image.endpoints.flux_2_flex]
# Verified M11 (schema + page): prompt, image_size {width,height}, seed, guidance_scale 1.5..10
# (default 3.5; higher = more literal), num_inference_steps 2..50 (default 28), safety_tolerance
# "1".."5", output_format, enable_safety_checker. No negative prompt, no num_images, no
# has_nsfw_concepts in the output. Page: $0.05 per megapixel, input + output, rounded up
# (a 720x1280 text-to-image keyframe = 1 MP = $0.05).
endpoint = "fal-ai/flux-2-flex"
usd_per_megapixel = 0.05
round_up_megapixels = true
params = { num_inference_steps = 28, guidance_scale = 3.5 }

[fal.image.endpoints.kontext_pro]
# Verified 2026-11-05 (model page + /api schema): FLUX.1 Kontext [pro], image + prompt → image.
# Input: prompt (required), image_url (required), seed, guidance_scale (default 3.5), num_images
# (default 1), output_format jpeg|png, safety_tolerance "1".."6" (default "2"), enhance_prompt,
# aspect_ratio 21:9|16:9|4:3|3:2|1:1|2:3|3:4|9:16|9:21. No negative prompt, no image_size.
# Output: images[0].url. Price: $0.04 per image (page and pricing API agree).
# Chosen over FLUX.2 [dev] edit ($0.012/processed MP, up to 4 image_urls): Kontext is built for
# keeping one object's identity while changing the scene around it, which is exactly the job.
endpoint = "fal-ai/flux-pro/kontext"
usd_per_image_flat = 0.04
image_field = "image_url"
params = { guidance_scale = 3.5, num_images = 1, safety_tolerance = "2" }

[fal.image.endpoints.kontext_multi]
# Verified 2026-11-05 (model page + /api schema): FLUX.1 Kontext [pro] multi ("experimental").
# Input: prompt (required), image_urls list (required; max count and order semantics not stated),
# seed, guidance_scale (default 3.5), num_images (1), output_format jpeg|png, safety_tolerance
# "1".."6" (default "2"), enhance_prompt, aspect_ratio enum as Kontext. Output: images[0].url.
# Price: $0.04 per image (page and pricing API agree). Prompts name images by their content.
endpoint = "fal-ai/flux-pro/kontext/multi"
usd_per_image_flat = 0.04
image_field = "image_urls"
params = { guidance_scale = 3.5, num_images = 1, safety_tolerance = "2" }

[fal.audio]
default = "lyria2"

[fal.audio.endpoints.lyria2]
# Verified 2026-11-05 (model page, /api tab, queue OpenAPI schema, and the pricing API with this
# account's key): Google Lyria 2 on fal. Input: prompt (required, <= 2000 chars), negative_prompt
# (default "low quality"), seed (optional int), enable_safety_checker (default true). No duration
# field: every track is 30 s, 48 kHz WAV. Output: audio.url. Price: pricing API "unit_price 0.1,
# unit 30 seconds" = $0.10 per track (page: "$0.1 per 30 second"). Licence: the page marks it
# "Commercial use" (fal partner model); no separate licence text is linked from the page.
# Chosen over Stable Audio 2.5 ($0.20/track, above the $0.15 music cap), ElevenLabs music ($0.60:
# billed per started minute), MiniMax v2 (lyrics required: no instrumental), CassetteAI and
# ACE-Step (cheaper, no partner/commercial terms beyond the badge, weaker for cinematic scores).
endpoint = "fal-ai/lyria2"
usd_per_track = 0.10
track_s = 30
params = { negative_prompt = "vocals, singing, voice, choir, lyrics, spoken words, low quality" }

[fal.video]
default = "kling_v3_pro"

[fal.video.endpoints.kling_v3_pro]
# Schema: start_image_url (required), prompt (<=2500 chars), negative_prompt, cfg_scale 0..1,
# duration "3".."15" (string enum), generate_audio (default true: we send false). Aspect ratio
# comes from the start image.
endpoint = "fal-ai/kling-video/v3/pro/image-to-video"
adapter = "kling"
image_field = "start_image_url"
usd_per_second = 0.14
min_duration_s = 3
max_duration_s = 15

[fal.video.endpoints.kling_v3_pro.profile]
# max_single_shot_s: duration enum "3".."15" in the verified schema. [observed] = seen in our M11
# real runs; [expected] = vendor docs / general experience, not yet verified by us.
max_single_shot_s = 15
strengths = [
  "keeps a product crisp, stable and true to the start frame through the whole clip [observed]",
  "a single person in natural motion (walking, turning, a simple gesture like spraying) renders convincingly: the majlis man [observed]",
  "smooth continuous camera moves with real parallax: push-in, dolly, orbit [observed]",
  "one continuous take up to 15 s, no cuts needed [expected]",
  "physical motion: liquids splashing and pouring, fabric, objects tumbling or flying toward or past the lens [expected]",
  "slow motion of one clear physical event [expected]",
]
weaknesses = [
  "light-only events (a shadow passing, light changing) are often ignored [observed]",
  "invents smoke or steam near the product when smoke, dust or particles are mentioned [observed]",
  "renders 4-8 min per clip and costs ~$0.14/s: few retries affordable [observed]",
  "identity across separate scenes: each scene is a new generation, so the same man or bottle drifts between scenes [observed]",
  "small background objects and precise prop or doorway placement [observed in keyframes]",
  "readable text, logos, signage; crowds; lip-sync; fine finger-level hand-object manipulation in close-up [expected]",
]


[fal.video.endpoints.kling_v3_standard]
# Verified 2026-11-05: same schema as v3 Pro. Page price $0.084/s audio off ($0.126 on); the
# pricing API reports $0.14/s for every Kling tier. Billing check (hero v2 round): the dashboard
# fell $2.00 → $0.90 = $1.10 for $0.505 of stills (page = API prices) + 9 s of this endpoint, i.e.
# ≈ $0.066/s actually charged. So fal bills at most the page price; we budget the page price.
# Resolution tier not stated on the page.
# Schema: start_image_url (required), prompt (<=2500 chars), negative_prompt, cfg_scale 0..1,
# duration "3".."15" (string enum), generate_audio (default true: we send false). Aspect ratio
# comes from the start image.
endpoint = "fal-ai/kling-video/v3/standard/image-to-video"
adapter = "kling"
image_field = "start_image_url"
usd_per_second = 0.084
min_duration_s = 3
max_duration_s = 15

[fal.video.endpoints.kling_v3_standard.profile]
# max_single_shot_s: duration enum "3".."15" in the verified schema. [observed] = seen in our M11
# real runs; [expected] = vendor docs / general experience, not yet verified by us.
max_single_shot_s = 15
strengths = [
  "keeps a product crisp, stable and true to the start frame through the whole clip [observed]",
  "a single person in natural motion (walking, turning, a simple gesture like spraying) renders convincingly: the majlis man [observed]",
  "smooth continuous camera moves with real parallax: push-in, dolly, orbit [observed]",
  "one continuous take up to 15 s, no cuts needed [expected]",
  "physical motion: liquids splashing and pouring, fabric, objects tumbling or flying toward or past the lens [expected]",
  "slow motion of one clear physical event [expected]",
]
weaknesses = [
  "light-only events (a shadow passing, light changing) are often ignored [observed]",
  "invents smoke or steam near the product when smoke, dust or particles are mentioned [observed]",
  "standard tier: same v3 model, lower tier than Pro; finer detail and sharpness not yet observed by us [expected]",
  "identity across separate scenes: each scene is a new generation, so the same man or bottle drifts between scenes [observed]",
  "small background objects and precise prop or doorway placement [observed in keyframes]",
  "readable text, logos, signage; crowds; lip-sync; fine finger-level hand-object manipulation in close-up [expected]",
]

[fal.video.endpoints.ltx_23_fast]
# Cheap "dev" model. Schema: image_url + prompt (required), duration int enum 6..20 step 2
# (>10 s only at 25 fps/1080p; we stay <=10), fps 24|25|48|50, resolution 1080p|1440p|2160p,
# aspect_ratio auto|16:9|9:16, generate_audio (default true: we send false). No negative prompt.
# Minimum 6 s: shorter scenes are rendered at 6 s and trimmed at assembly.
endpoint = "fal-ai/ltx-2.3/image-to-video/fast"
adapter = "ltx"
image_field = "image_url"
usd_per_second = 0.06
allowed_durations_s = [6, 8, 10]

[fal.video.endpoints.ltx_23_fast.profile]
max_single_shot_s = 10      # 6/8/10 s at 24 fps (12-20 s only at 25 fps 1080p)
strengths = [
  "cheap and fast: ~35 s and $0.06/s per clip, good for iteration [observed]",
  "keeps the start frame's product stable when nothing crosses it [observed]",
]
weaknesses = [
  "renders a passing shadow or fabric as a translucent veil over the frame [observed 2/3]",
  "camera moves are faint (a push-in barely reads) [observed]",
  "minimum render 6 s: shorter scenes are trimmed, so the action must resolve early [observed]",
]

# Not verified in M11 (not used); re-verify before enabling.
[fal.video.endpoints.seedance_2]
endpoint = "bytedance/seedance-2.0/image-to-video"
adapter = "seedance"
usd_per_second = 0.3034
min_duration_s = 4
max_duration_s = 15

[fal.video.endpoints.veo31_fast]
endpoint = "fal-ai/veo3.1/fast/image-to-video"
adapter = "veo"
usd_per_second = 0.10
allowed_durations_s = [4, 6, 8]

# ---------------------------------------------------------------- Higgsfield (ADR-0022)
# Verified 2026-11-06 against docs.higgsfield.ai (models/seedance-2/reference-to-video,
# models/seedance-2-5/reference-to-video, concepts/requests, billing-and-retention, file-uploads,
# idempotency, polling, rate-limits). Nothing from memory.
# - Called over REST with httpx, NOT the higgsfield-client SDK: the SDK retries every request
#   (including the paid submit) 3x on 408/429/5xx with no idempotency key and no public switch.
# - Submit: POST {base_url}/{endpoint} → {status: queued, request_id, status_url, cancel_url};
#   poll status_url → queued | in_progress | completed | failed | nsfw | canceled; the video is
#   at video.url in the completed status body. failed and nsfw are NOT charged. Outputs are
#   deleted 7 days after the request finishes (we download at once). Idempotency-Key supported.
# - Inputs must be PUBLIC urls (asset:// rejected): POST /files/generate-upload-url, then PUT.
# - No published price for either model: every job is priced by POST /estimate/{endpoint} with
#   the same body. The docs say it returns {"usd": "x.xx"}. OBSERVED 2026-11-06 for Seedance
#   2.0: it returns {"type": "description", "pricing_description": "Token-metered pricing..."}
#   instead (no number). The call was free (console balance unchanged at $5). The formula from
#   that description is in [...seedance_20_ref.pricing]; the provider prices from it and adds a
#   10% margin, and refuses if the live description stops naming the configured rates.
#   max_usd_per_second is only a sanity cap against a misread estimate.
# - No seed and no negative prompt in either schema. Prompt length limit: not documented.
[higgsfield]
base_url = "https://api.higgsfield.ai"

[higgsfield.video]
default = "seedance_20_ref"

[higgsfield.video.endpoints.seedance_20_ref]
# image_urls 1-9, video_urls <= 3, audio_urls <= 3 (we send images only); duration int 4-15
# (default 5); resolution 480p|720p|1080p|4k (default 720p); aspect 16:9|4:3|1:1|3:4|9:16|21:9
# (default 16:9); generate_audio default true. Never mix image_urls with image_url/end_image_url.
endpoint = "bytedance/seedance-2.0/reference-to-video"
min_duration_s = 4
max_duration_s = 15
default_duration_s = 8  # the multishot demo target (user, 2026-11-06)
resolutions = ["480p", "720p", "1080p", "4k"]
default_resolution = "720p"
aspect_ratios = ["16:9", "4:3", "1:1", "3:4", "9:16", "21:9"]
max_images = 9
max_usd_per_second = 1.0

[higgsfield.video.endpoints.seedance_20_ref.pricing]
# From the live /estimate description (2026-11-06), verbatim: "Billable video tokens =
# ceil((input video seconds + generated video seconds) × output width × output height × 24 fps /
# 1024). Image and audio references do not count as video input. Per 1,000 video tokens: without
# video input — 480p/720p/1080p $0.014, 4K $0.008 ... Rates shown are before any applicable
# customer discount." We send no video input. Frame sizes are NOT stated: short side assumed
# below (720p 9:16 = 720x1280), checked against ffprobe after the first real generation.
usd_per_1k_tokens = { "480p" = 0.014, "720p" = 0.014, "1080p" = 0.014, "4k" = 0.008 }
fps = 24
tokens_divisor = 1024
short_side_px = { "480p" = 480, "720p" = 720, "1080p" = 1080, "4k" = 2160 }
# Was 0.10. Try 1 was billed $2.06 against a computed $2.419 (console, 2026-11-06): the
# computed price is an upper bound, so no margin (user, 2026-11-06).
margin = 0.0

[higgsfield.video.endpoints.seedance_20_ref.profile]
max_single_shot_s = 15
strengths = [
  "one generation holds several numbered shots with cuts, camera moves and native audio [expected]",
  "the product stays close to the reference photo across every shot of the generation [expected]",
  "physical events around a still product: liquids, mist, light on glass and metal [expected]",
]
weaknesses = [
  "the cut points do not follow the planned timecodes exactly [expected]",
  "readable text, logos and small engraved emblems drift or get invented [expected]",
  "no seed: a re-generation is a new roll, never the same video [observed in the schema]",
]

[higgsfield.video.endpoints.seedance_25_ref]
# Differences from 2.0: duration int 4-30; no 4k; image_urls up to 30 (50 references in total);
# audio-only references allowed; extra field bitrate_mode standard|high (default high).
endpoint = "bytedance/seedance-2.5/reference-to-video"
min_duration_s = 4
max_duration_s = 30
default_duration_s = 8
resolutions = ["480p", "720p", "1080p"]
default_resolution = "720p"
aspect_ratios = ["16:9", "4:3", "1:1", "3:4", "9:16", "21:9"]
max_images = 30
max_usd_per_second = 1.0
