# Saudi culture bank (ADR-0026, phase 4). DATA fed to the insight stage: rituals, proverbs,
# occasions, gestures, objects and phrases that carry MEANING an ad can stand on (culture as
# meaning, never as decoration). Each insight names the entry it stands on (culture_anchor) or
# "none". Arabic is stored in logical order. TO BE REVIEWED BY THE USER before the first real run.
#
# theme (ADR-0028): hospitality | family | self | occasion | travel | craft | season. The insight
# stage gets a balanced sample (at most 3 entries per theme), and ideate spreads its candidates
# over the themes, because 4 of 5 planning runs won with a host waiting for a guest.
# Fields: id (snake_case) · theme · kind · text_ar (as people say it) · meaning_en (what it means) ·
# use (how an ad can stand on it: a turn, a gesture, a payoff) · categories (product categories
# it fits; "any" fits every product) · pitfalls (what an ad must not do with it).

# Pitfalls for every ad, whatever the entry (Saudi hospitality and respect).
general_pitfalls = [
  "a host never ignores or delays a guest at the door: a ringing bell is answered, the guest is never kept waiting (ignoring it reads as rude, not as self-care)",
  "no beat shows anyone neglecting a guest, an elder or a parent, even for a moment",
]

# Words that put a brief in a category (matched in the brief's English category and product, and
# in the raw request, which may be Arabic).
[aliases]
perfume = ["perfume", "fragrance", "scent", "oud", "eau de", "عطر", "عطور", "عود", "دهن"]
incense = ["incense", "bakhoor", "bukhoor", "mabkhara", "بخور", "مبخرة", "دخون"]
coffee = ["coffee", "qahwa", "espresso", "cardamom", "قهوة", "بن", "دلة", "محمصة"]
dates = ["dates", "date fruit", "ruttab", "rutab", "sukkari", "ajwa", "khalas", "تمر", "تمور", "رطب", "عجوة", "سكري", "خلاص"]
fashion = ["abaya", "thobe", "fashion", "clothing", "bisht", "عباية", "عبايات", "ثوب", "أزياء", "بشت"]
food = ["food", "sweets", "chocolate", "pastry", "حلويات", "حلا", "شوكولاتة"]

# Physical objects (ADR-0026, 2026-11-07): the canonical Gulf version of an object a prop may be.
# When a prompt's prop matches one by name, code uses this description for the prompt, the prop
# image and its vision check, which fails a generic or non-Gulf version (run
# run_01M6SSVMPBEAY1WW1FWF4DGWRZ drew a European gooseneck pot for "dallah").
# Fields: id · names (English and Arabic, matched against the prop's name) · description (one
# physical line, at most 200 characters) · not_like (the wrong versions a model tends to draw) ·
# ref_image (optional: a verified photo, used at $0 instead of a generated image) ·
# gloss (2-4 words for the compact References line when the prompt is over the limit).
[[objects]]
id = "dallah"
gloss = "Saudi coffee pot"
ref_image = "assets/dallah.webp"  # a verified reference photo (user, 2026-11-07)
names = ["dallah", "dalla", "arabic coffee pot", "coffee pot", "دلة", "دلّة"]
description = "a Saudi dallah: brass body pinched at the waist above a wide base, a tall crescent beak spout, a domed lid with a pointed finial, a curved side handle"
not_like = ["a European or Turkish coffee pot", "a gooseneck kettle with a thin straight spout", "a teapot", "a moka pot", "a glass brewer or pour-over carafe (Saudi qahwa in a finjan is poured only from a dallah)"]

[[objects]]
id = "finjan"
gloss = "Arabic coffee cup"
ref_image = "assets/finjan.jpeg"  # a verified reference photo (user, 2026-11-07)
names = ["finjan", "fenjan", "arabic coffee cup", "coffee cup", "فنجان", "فناجين"]
description = "a small handleless Arabic coffee cup (finjan), white porcelain with a thin gold band, about egg-cup size, a third full of light golden coffee"
not_like = ["a mug or any cup with a handle", "an espresso cup on a saucer", "dark black coffee"]

[[objects]]
id = "mabkhara"
gloss = "Gulf incense burner"
names = ["mabkhara", "incense burner", "bakhoor burner", "burner", "مبخرة"]
description = "a Gulf mabkhara: a carved dark-wood or brass pedestal, wider at the base, with a small bowl on top holding glowing charcoal and oud"
not_like = ["a church censer on chains", "an incense-stick holder", "a candle", "a perfume bottle"]

[[objects]]
id = "mandoos"
gloss = "brass-studded wooden chest"
names = ["mandoos", "wooden chest", "chest", "مندوس"]
description = "a mandoos: a low dark teak chest covered with brass studs and brass plates in geometric patterns, with a hinged lid"
not_like = ["a pirate treasure chest", "a modern storage box", "a plain suitcase"]

[[objects]]
id = "najr"
gloss = "brass coffee mortar"
names = ["najr", "brass mortar", "mortar", "نجر", "هاون"]
description = "a heavy brass mortar (najr) with a long brass pestle, used to pound roasted coffee beans with cardamom"
not_like = ["a stone kitchen mortar", "an electric coffee grinder"]

[[objects]]
id = "bisht"
gloss = "gold-trimmed cloak"
names = ["bisht", "cloak", "بشت"]
description = "a bisht: a flowing sheer wool cloak in black, brown or cream with wide gold-embroidered trim along the front edges, worn open over a white thobe"
not_like = ["a bathrobe", "a cape", "a Western overcoat"]

# ------------------------------------------------------------------- scent: oud, bakhoor, perfume
[[entries]]
id = "bakhoor_before_guests"
theme = "hospitality"
objects = ["mabkhara"]
kind = "ritual"
text_ar = "تبخير البيت قبل وصول الضيوف"
meaning_en = "The host lights the burner minutes before guests arrive, so the scent welcomes them before anyone speaks: generosity begins with the senses."
use = "a turn: the guest knows they were expected because the house already smells of welcome"
categories = ["perfume", "incense"]
pitfalls = ["no open flame near curtains or children", "the scent is a welcome, not a show of wealth", "the host never ignores or delays a guest at the door"]

[[entries]]
id = "bakhoor_farewell"
theme = "hospitality"
objects = ["mabkhara"]
kind = "ritual"
text_ar = "تبخير الضيف قبل انصرافه"
meaning_en = "At the end of a gathering the burner is passed to the guests, who perfume their ghutra and sleeves: an honour, and a graceful sign that the visit is ending."
use = "a payoff: the guest leaves carrying the host's scent; the product continues the gesture outside the house"
categories = ["perfume", "incense"]
pitfalls = ["the elder is dignified, never a caricature", "no rushing the guest out: it is an honour, not an eviction", "the host never ignores or delays a guest at the door"]

[[entries]]
id = "after_oud_no_sitting"
theme = "hospitality"
objects = ["mabkhara"]
kind = "proverb"
text_ar = "بعد العود ما فيه قعود"
meaning_en = "Once the incense has been passed round, nobody stays: the scent closes the visit without a word being said."
use = "a hook or a turn: a gathering ends with scent instead of words; the product as the polite last word"
categories = ["perfume", "incense"]
pitfalls = ["never shown as rudeness to the guest", "the proverb is spoken in the culture, not written on screen", "the host never ignores or delays a guest at the door"]

[[entries]]
id = "thobe_censing"
theme = "self"
objects = ["mabkhara"]
kind = "ritual"
text_ar = "تبخير الثوب والشماغ قبل الخروج"
meaning_en = "Before leaving for an occasion, a man holds the burner under his shemagh and sleeves for a quiet minute: preparing to honour the people he will meet."
use = "a quiet minute before the door: the ritual compressed into one spray for a fast life"
categories = ["perfume", "incense", "fashion"]
pitfalls = ["Saudi thobe with a stiff collar, shemagh or ghutra with agal (see culture.toml)", "no smoke crossing the product"]

[[entries]]
id = "scent_arrives_first"
theme = "self"
kind = "phrase"
text_ar = "ريحتك سبقتك"
meaning_en = "People are recognised by their scent before they appear: a familiar perfume announces someone loved."
use = "a hook: someone is recognised by scent alone, before they are seen"
categories = ["perfume"]
pitfalls = ["no romantic contact between unrelated men and women"]

[[entries]]
id = "oud_on_the_bisht"
theme = "family"
objects = ["bisht"]
kind = "object"
text_ar = "ريحة العود في بشت الأب"
meaning_en = "A father's bisht or ghutra keeps his oud for years: children know him by it, and the scent becomes family memory."
use = "memory: a son or daughter opens a wardrobe and the scent brings the father back"
categories = ["perfume", "incense", "fashion"]
pitfalls = ["grief only if handled with restraint", "the bisht is worn at occasions, not daily"]

[[entries]]
id = "perfume_never_refused"
theme = "occasion"
kind = "proverb"
text_ar = "الطيب ما يُرد"
meaning_en = "A gift of perfume is never refused: offering scent is offering respect, and accepting it honours the giver."
use = "a gesture: perfume offered and accepted as the moment that seals a relationship"
categories = ["perfume", "incense"]
pitfalls = ["no religious text on screen", "the gift is offered with the right hand"]

[[entries]]
id = "grandmother_chest"
theme = "family"
objects = ["mandoos"]
kind = "object"
text_ar = "مندوس الجدة"
meaning_en = "The grandmother's wooden chest holds her oud, her perfume oils and her keepsakes; opening it releases the smell of the family's past."
use = "a reveal: the chest opens and three generations meet in one scent"
categories = ["perfume", "incense"]
pitfalls = ["the grandmother is respected, not frail or comic", "women's hair covered when men are present"]

[[entries]]
id = "henna_night"
theme = "occasion"
kind = "occasion"
text_ar = "ليلة الحناء"
meaning_en = "Before the wedding, the bride's women relatives gather for henna, songs and perfume: the bride's last night as a daughter of the house."
use = "a women-only gathering where scent and henna mark a change of life"
categories = ["perfume", "fashion"]
pitfalls = ["women only, modest framing, no men present", "no faces of real brides"]

# --------------------------------------------------------------------- coffee and hospitality
[[entries]]
id = "coffee_right_hand"
theme = "hospitality"
objects = ["dallah", "finjan"]
kind = "gesture"
text_ar = "تقديم القهوة باليمين وبدء الصب بالكبير"
meaning_en = "The pourer holds the dallah in the left hand and offers the finjan with the right, starting with the eldest or the most honoured guest: an order of respect everyone in the room reads. The younger usually serves the elder, so an elder who pours for a younger person is giving an honour."
use = "a turn: who is served first tells the story without a word"
categories = ["coffee", "dates"]
pitfalls = ["the pourer stands, the cup is filled only a little", "the dallah in the left hand, the finjan offered with the right: never offered with the left", "Saudi qahwa is poured only from a dallah, never from a glass brewer, kettle or teapot", "the host never ignores or delays a guest at the door"]

[[entries]]
id = "shake_the_cup"
theme = "hospitality"
objects = ["finjan"]
kind = "gesture"
text_ar = "هزّ الفنجان"
meaning_en = "A guest shakes the small cup gently to say 'enough'; until then the host keeps pouring. A silent language every Saudi knows."
use = "a hook or a payoff: the shake that ends (or refuses to end) the pouring"
categories = ["coffee"]
pitfalls = ["the cup is a small handleless finjan, filled a third", "poured from a dallah held in the left hand, never from a glass brewer or kettle", "the host never ignores or delays a guest at the door"]

[[entries]]
id = "four_cups"
theme = "craft"
objects = ["finjan"]
kind = "proverb"
text_ar = "الهيف والضيف والكيف والسيف"
meaning_en = "The traditional cups: the host tastes the first (al-haif) to show it is good, then the guest's cup, the cup of pleasure, and the cup of the sword (standing by the host)."
use = "structure: an ad told in cups, each cup one beat"
categories = ["coffee"]
pitfalls = ["no weapons shown with the 'sword' cup: it is a pledge, not a fight"]

[[entries]]
id = "dates_with_coffee"
theme = "hospitality"
objects = ["finjan", "dallah"]
kind = "ritual"
text_ar = "التمر مع القهوة"
meaning_en = "Saudi coffee is always served with dates: the bitterness of cardamom coffee and the sweetness of the date belong together, and offering both is the welcome."
use = "a pairing: the product completes the other half of the welcome"
categories = ["coffee", "dates"]
pitfalls = ["Saudi coffee is light gold with cardamom, not dark espresso", "qahwa is poured into the finjan only from a dallah, never from a glass brewer, kettle or teapot"]

[[entries]]
id = "dallah_on_the_fire"
theme = "hospitality"
objects = ["dallah"]
kind = "object"
text_ar = "الدلة على النار"
meaning_en = "A dallah kept warm means the door is open: whoever comes will be served. It is the symbol of a generous house."
use = "a promise: the warm dallah waiting for someone who has not arrived yet"
categories = ["coffee"]
pitfalls = ["a brass or steel dallah with its beak spout, not a European coffee pot", "the host never ignores or delays a guest at the door"]

[[entries]]
id = "mortar_call"
theme = "craft"
objects = ["najr"]
kind = "ritual"
text_ar = "صوت النجر"
meaning_en = "The rhythm of coffee beans pounded in the brass mortar (najr) carried across the camp and the neighbourhood: an invitation to come and drink."
use = "a sound hook: the rhythm calls people before the picture shows them"
categories = ["coffee"]
pitfalls = ["the rhythm is a musical, joyful beat, not noise"]

[[entries]]
id = "morning_coffee"
theme = "self"
objects = ["finjan"]
kind = "ritual"
text_ar = "قهوة الصباح قبل الكلام"
meaning_en = "In many homes the day starts with the first cup of coffee and dates, often with the parents, before anyone talks about work."
use = "a quiet beginning: the minute that belongs to the family before the day takes over"
categories = ["coffee", "dates"]
pitfalls = []

[[entries]]
id = "guest_three_days"
theme = "hospitality"
kind = "proverb"
text_ar = "الضيف ما يُسأل عن حاجته ثلاثة أيام"
meaning_en = "By old custom a guest is hosted for three days before being asked why they came: hospitality is given before anything is asked."
use = "a value: giving first, asking never"
categories = ["coffee", "dates", "any"]
pitfalls = ["not literal: a value, never a long scene of a stay", "the host never ignores or delays a guest at the door"]

[[entries]]
id = "house_is_yours"
theme = "hospitality"
kind = "phrase"
text_ar = "البيت بيتك"
meaning_en = "'The house is yours': the host's sentence that hands the guest the freedom of the home."
use = "a payoff line for the end card or a gesture that says it"
categories = ["any"]
pitfalls = ["the host never ignores or delays a guest at the door"]

[[entries]]
id = "the_majlis"
theme = "hospitality"
kind = "object"
text_ar = "المجلس"
meaning_en = "The sitting room for guests: cushions along the walls, the host serving, the order of seats showing respect. Where a family meets the outside world."
use = "the one location of an ad whose story is about welcome and respect"
categories = ["any"]
pitfalls = ["the majlis as a place of meaning, not a museum set of trays and lanterns", "the host never ignores or delays a guest at the door"]

[[entries]]
id = "kashta"
theme = "season"
objects = ["dallah"]
kind = "occasion"
text_ar = "الكشتة"
meaning_en = "A winter outing to the desert or the wadi with family or friends: a small fire, coffee on the coals, the cold evening shared."
use = "a setting of togetherness for coffee or dates"
categories = ["coffee", "dates"]
pitfalls = ["the desert is a cliché for perfume ads: use it only for coffee or dates", "no driving stunts"]

[[entries]]
id = "road_thermos"
theme = "travel"
objects = ["finjan"]
kind = "ritual"
text_ar = "ترمس القهوة في الطريق"
meaning_en = "On a long drive between cities or to the family's village, someone always brings a thermos of Saudi coffee and small cups; the first stop is for coffee and dates by the road."
use = "a journey: the taste of home carried on the road, poured at the first stop"
categories = ["coffee", "dates"]
pitfalls = ["no pouring while driving", "the desert road is a setting, not a perfume cliché here"]
# TO BE REVIEWED BY THE USER (added 2026-11-07, ADR-0028).

[[entries]]
id = "home_roast"
theme = "craft"
kind = "ritual"
text_ar = "تحميص البن في البيت"
meaning_en = "In many homes the beans are still roasted in a pan and ground with cardamom; the smell fills the house and everyone knows coffee is coming. Knowing the right roast is a quiet pride."
use = "craft: the hand that knows when the bean is ready; the smell that calls the house"
categories = ["coffee"]
pitfalls = ["Saudi coffee is a light roast, golden, never black espresso", "brewed in and poured from a dallah into a finjan; a glass brewer or pour-over belongs only with dark specialty coffee in ordinary cups"]
