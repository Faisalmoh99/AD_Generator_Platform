# Visual devices (ADR-0029): the cinematic image an idea is shown with. DATA: the code only reads it
# (domain/visual_devices.py). The culture bank gives an ad its MEANING; a device gives it the ONE
# image only a moving picture can show. Our planning runs found true insights and filmed them as
# ordinary domestic scenes (a man pours coffee); try 2's human prompt had a device (the incense
# smoke condenses into the bottle) and read as an ad.
#
# Why devices: Goldenberg, Mazursky & Solomon, "The Fundamental Templates of Quality Ads"
# (Marketing Science 18(3), 1999): about 89 % of 200 award-winning ads fit a small set of
# templates, 50 % of winners vs 2.5 % of non-winners; novices trained on templates made ads judged
# more creative than brainstorming groups. A device is a template, made concrete for video.
#
# Fields: id · name · how_it_works (what the viewer sees, in order) · why_video_only (why a still
# cannot show it) · categories (culture-bank categories, or "any") · seedance (wording that renders
# it in one shot, built from our physics library; never a banned word) · renderability (proven:
# seen in our own generation; likely: physical motion Seedance renders; unproven: untested, risky)
# · proven_by (the run that proved it) · min_s (the shortest key shot that shows it).

[[devices]]
id = "invisible_made_visible"
name = "Make the invisible visible"
how_it_works = "Something that cannot be seen (a scent, warmth, a memory, a sound) gets a body on screen: a thin ribbon of golden mist, a shimmer of warm air, a thread of light-catching specks that moves through the room."
why_video_only = "The thing moves, spreads and reaches someone in time; a still shows only a decoration."
categories = ["perfume", "incense", "coffee", "food", "any"]
seedance = "a thin, clearly visible ribbon of golden mist, a hand's width wide, drifts slowly from the open bottle across the room toward the doorway"
renderability = "likely"
min_s = 2.0

[[devices]]
id = "trail_to_follow"
name = "A trail to follow"
how_it_works = "A visible trail (scent, steam, a line of something) leads through space; a person follows it room to room and finds who or what is at its end."
why_video_only = "Following is a journey in time: the meaning is in the walking and the arrival."
categories = ["perfume", "incense", "coffee", "food", "any"]
seedance = "the boy follows the thin golden ribbon of mist along the hallway, one slow step at a time, until it ends at his father's collar"
renderability = "likely"
min_s = 2.5

[[devices]]
id = "transformation"
name = "Transformation"
how_it_works = "One object turns into the product in visible steps inside one shot: incense smoke spirals tighter and condenses into the bottle; steam gathers into the shape of the pouch."
why_video_only = "The change itself is the image; a still can show only before or after."
categories = ["perfume", "incense", "coffee", "dates", "food", "any"]
seedance = "the smoke spirals tighter, thickens, then condenses step by step into the bottle resting in his open palm"
renderability = "proven"
proven_by = "run_01M6RYP42HB0GBFFYBAY09SGCW (try 2): rendered, but compressed to 0.5 s; give it at least 2.5 s and visible steps"
min_s = 2.5

[[devices]]
id = "match_on_shape"
name = "Match on shape"
how_it_works = "A hard cut joins two objects with the same shape at the same place in the frame (the burner's brass dome and the bottle's dome cap; the round finjan and the full moon), so the second inherits the first one's meaning."
why_video_only = "The rhyme happens across a cut, in time; it needs two images in sequence."
categories = ["any"]
seedance = "hard cut from the brass dome of the incense burner to the gold dome cap of the bottle, the same size and place in the frame"
renderability = "likely"
min_s = 2.0

