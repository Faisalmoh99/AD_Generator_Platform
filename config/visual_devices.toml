# Two worked examples shown to ideate as the quality bar (never to copy: code refuses a concept
# that shares 2+ motifs with one of them). The first is the user's; the second is try 2's human
# idea (run_01M6RYP42HB0GBFFYBAY09SGCW).
[[exemplars]]
id = "scent_trail_boy"
devices = ["invisible_made_visible", "trail_to_follow"]
idea = "A small boy smells his father's perfume in the hallway; the scent shows as a thin trail of golden specks; he follows it room to room until he finds his father."
why = "The truth (a child knows his father by his scent) gets one image only film can show: the invisible scent gets a body, the body a direction, the direction a story. The product causes the trail, so it is necessary, and the turn (he finds his father) needs no words."
motifs = ["boy", "father", "hallway", "trail"]

[[exemplars]]
id = "burner_to_bottle"
devices = ["transformation"]
idea = "In a majlis at night an elder passes the incense burner to a young man leaving; he draws the smoke into his shemagh; the smoke spirals tighter and condenses into the perfume bottle in the elder's palm, which he gives the young man at the door."
why = "The ritual (perfuming a guest before he leaves) turns into the product in one continuous image: the culture is the meaning and the device is the hinge. The product continues the gesture outside the house, so the turn is the product itself."
motifs = ["elder", "majlis", "incense burner", "smoke"]
