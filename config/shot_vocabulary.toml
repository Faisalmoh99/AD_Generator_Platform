# Shot vocabulary (PLAN_V2 item 2, ADR-0018): what the storyboard may pick per montage shot.
# Physics-led, from the two montage references in docs/PLAN_V2.md. Each entry declares what the
# shot shows (needs_product / shows_person: the scene flags come from here, not from text
# matching), how the product identity is made (identity_mode, item 3: none = plain text-to-image,
# direct = Kontext from the locked packshot, composite = plain keyframe then Kontext multi swap,
# crop = a macro cut from the packshot in code (`crop` = cap | edge) then relit onto black)
# and the defaults the prompt writer starts from. `fallback` is for the escalation ladder
# (MORE_TIME 15, not built). `avoid_on` lists video endpoints that render the entry badly.
# framing: macro | product | event | detail | silhouette | full

[shots.cap_macro]
label = "Extreme macro of the cap"
framing = "macro"
needs_product = true
shows_person = false
identity_mode = "crop"
crop = "cap"
key_shot = false
shot_type = "extreme_close_up"
camera = "push_in"
speed = "slow_motion"
lighting = "one hard rim light raking across the cap's facets, everything else in darkness"
motion = "a very slow push-in while a thin band of light slides over the cap's facets"
keyframe_hint = "the cap and the neck below it fill the frame, the top of the shoulders at the bottom edge; facet edges razor sharp; black background"
fallback = "light_sweep"
avoid_on = []

