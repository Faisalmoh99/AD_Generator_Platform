motion = "a slow push-in on the glass shoulder as the rim light glints along its edge"
keyframe_hint = "the bottle's upper shoulder and one vertical glass edge fill the frame, the dark liquid glowing behind the glass; black background"
fallback = "light_sweep"
avoid_on = []

