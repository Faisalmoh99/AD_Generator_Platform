# Creative rules for the whole-ad (multishot) prompt (ADR-0026). DATA: the code only reads it
# (domain/creative_rules.py). Where they come from: the frame-by-frame analysis of Halai's
# product-review ad and the Valentino Seedance reference (2026-11-07), and what our two real
# generations got wrong (try 1 run_01M6RTDPZEDAG98QZ9KPXT4NRY, try 2 run_01M6RYP42HB0GBFFYBAY09SGCW).
#
# [params] and [[banned]] are checked by CODE on every ad prompt (writer and director); a
# failure goes back to the model through the schema-repair loop with the replacement named.
# [[judge]] rules need judgement: the creative director (an LLM) rules on each by id.
# [lessons] are shown to the director verbatim.

# Camera moves that read in one Seedance shot (one per shot; community guides and our runs).
camera_moves = ["slow push-in", "slow pull-back", "slow orbit", "gentle handheld drift", "slow tilt up", "slow truck left or right", "rack focus", "locked hold (last shot only)"]

[params]
max_shots = 4              # the format allows 3-4 (formats.toml)
min_shot_s = 1.5           # the model cut try 2's 2 s shot 1 to 1.2 s; never plan less than this
key_min_s = 2.0            # the turn / transformation shot (try 2's morph lasted 0.5 s)
hero_min_s = 2.0           # the last shot: the product holds the frame
product_min_shots = 3      # shots showing the product, or a prop that transforms into it
product_self_min_shots = 2 # shots showing the product itself
product_min_share = 0.5    # of the runtime, same counting as product_min_shots
handled_min_shots = 1      # shots where a person's hands hold or use the product
max_locations = 1          # one location for the whole film (both references: one)
max_references = 3         # prop or location references besides the product photo
# Word budget (ADR-0028, user 2026-11-07): Seedance guides converge on 60-100 words with the
# non-negotiables first ("8 requirements written, 4-5 honored"); ours were 350-400 words.
max_words = 180            # the writer's words: look + every shot (action, camera, sound) + audio
key_within_words = 30      # the identity line and the key-moment line end within these words
max_words_look = 30        # location + look + lighting together
max_words_shot = 35        # one shot: action + camera + sound (labels not counted)
max_words_audio = 20

# Words the video model took literally or that do not describe a picture. One table per word.
# `pattern` is a case-insensitive regex (default: the word with word boundaries);
# `fields = "camera"` limits the check to the camera text; `except_hero` allows it in the last shot.
[[banned]]
word = "ember"
pattern = "\\bembers?\\b"
why = "try 1: rendered as an open flame on the floor"
use = "a thin thread of incense smoke"

[[banned]]
word = "match cut"
pattern = "\\bmatch[- ]cut"
why = "try 1: read as 'show both objects', the hostess held a bottle-like burner"
use = "hard cut to"

[[banned]]
word = "becomes"
pattern = "\\b(becomes?|becoming|turns into)\\b"
why = "try 2: rendered as a swap, not a transformation"
use = "condenses in mid-air into (name what the viewer sees, step by step)"

[[banned]]
word = "dissolve"
pattern = "\\b(dissolves?|crossfades?|fades? into)\\b"
why = "try 1: a crossfade instead of a cut"
use = "hard cut to"

[[banned]]
word = "silhouette"
pattern = "\\bsilhouettes?\\b"
why = "try 1: the bottle 'as a soft silhouette' never rendered"
use = "the bottle in soft focus at the edge of the frame"

[[banned]]
word = "teased"
pattern = "\\b(teased?|teasing)\\b"
why = "not a visual instruction; the model ignores it"
use = "visible in soft focus"

[[banned]]
word = "floats"
pattern = "\\b(floats?|floating|hovers?|hovering)\\b"
why = "try 2: the burner and the bottle lost contact with the hand"
use = "rests in the open palm"

[[banned]]
word = "haze"
pattern = "\\bhaze\\b"
why = "fills the frame and veils the product"
use = "a single thread of smoke, away from the product"

[[banned]]
word = "hint"
pattern = "\\b(hints?|hinting|suggests?|suggesting|implies|implied)\\b"
why = "an idea, not a picture: the model renders nothing or something literal"
use = "name the visible object or motion"

[[banned]]
word = "glow"
pattern = "\\b(a|an|the) (\\w+ )?glow\\b"
why = "a glow named as an object becomes a lamp or a flame (try 1's 'ember glow')"
use = "warm light falls on ..."

[[banned]]
word = "static"
pattern = "\\b(static|locked[- ]off)\\b"
fields = "camera"
except_hero = true
why = "both references move every second; a static shot reads as a still"
use = "a slow push-in, a slow orbit or a gentle handheld drift"

[[banned]]
word = "fast"
pattern = "\\b(fast|quick|quickly|rapid|rapidly|snaps?|whips?|swift|swiftly|sudden|suddenly)\\b"
why = "the word most likely to degrade a Seedance shot (limbs and objects deform, events get skipped)"
use = "slowly, in one continuous motion"

[[banned]]
word = "extreme close-up"
pattern = "\\b(extreme close[- ]?up|ecu|macro)\\b"
fields = "camera"
why = "fingers drift or merge in extreme close-ups; medium and close shots of hands hold up"
use = "close-up, 85mm, the hand and the object in one frame"

# Seedance failure library (ADR-0028): what the model did wrong in our real generations and the
# wording that prevents it. CHECKED BY CODE: when a shot's action or event matches `trigger`, the
# same shot must also match `required` (case-insensitive regexes); a miss goes back to the model
# with `use`. `key_only` limits the rule to the key shot.
[[physics]]
id = "contact"
failure = "an object a hand should hold floats above the palm"
seen = "try 2: the burner and the bottle lost contact with the hand"
trigger = "\\b(holds?|holding|lifts?|lifting|raises?|raising|carries|carrying|hands? (it )?over|passes|passing|offers?|offering|cradles?|grips?)\\b"
required = "\\b(palm|grip|gripped|gripping|fingers?|fingertips?|thumb|by (its|the) (base|neck|handle|body|side|edge)|in (his|her|their|both) hands?|rests? (in|on)|resting (in|on))\\b"
use = "say what carries the weight: 'gripped between thumb and fingers', 'resting in her open palm', 'lifted by its base'"

[[physics]]
id = "visibility"
failure = "a spray, steam or smoke event is invisible"
seen = "try 2: the spray in the last shot could not be seen"
trigger = "\\b(spray|sprays|sprayed|spraying|mist|mists|steam|smoke|pours?|pouring|poured)\\b"
required = "\\b(visible|clearly|thick|thickens?|thickening|dense|ribbon|stream|plume|cloud|curl|curls|thread|column|jet|arc)\\b"
use = "name the visible shape and size: 'a visible fine mist, a hand's width, toward the collar', 'a thin ribbon of golden coffee'"

[[physics]]
id = "transformation"
failure = "a transformation is compressed into a fraction of a second or swapped"
seen = "try 2: a 2.5 s smoke-to-bottle morph lasted 0.5 s"
trigger = "\\b(condenses?|condensing|transforms?|morphs?|forms? into|reshapes?|gathers? into)\\b"
required = "\\b(then|step by step|gradually|tighter|thickens?|slowly|until)\\b"
use = "describe it in visible steps inside the shot: 'the smoke spirals tighter, thickens, then condenses into the bottle'"
key_only = false

# Reference ads we measured frame by frame (2026-11-07): their execution numbers, shown to the
# writer and the director as targets. Neither has an idea; we keep ours and borrow their craft.
[[templates]]
id = "halai_product_review"
source = "Halai product-review ad (15 s, measured frame by frame)"
numbers = "11 shots in 15 s (~1.4 s each); the product on screen 93 % of the time and in a person's hands 54 %; one location; one warm grade; a camera or a person moving every second"
borrow = "keep the product in frame and in hand for most of the film; give every shot a motion; one place, one grade"

[[templates]]
id = "valentino_seedance"
source = "Valentino Seedance reference (measured)"
numbers = "product on screen ~100 %; sound hits cut on the motion; −16 LUFS"
borrow = "one named sound hit on the key motion; the product holds the last shot"

# Judged by the creative director. The id is echoed in its verdicts (code checks one per id).
[[judge]]
id = "turn_withheld"
text = "The turn is not revealed before the key shot: shot 1 opens a question, it does not answer it. The product may be seen early; what it DOES is withheld until the key shot."

[[judge]]
id = "product_causes"
text = "A person handles the product and its use causes the turn (spray, open, pass, smell, gift). The product is never decoration on a table while the story happens elsewhere."

[[judge]]
id = "one_location"
text = "One location for the whole film, named in the location line; every shot can be filmed there (a doorway of the same room is the same location; outside the house is not)."

[[judge]]
id = "hook_motion"
text = "Shot 1 has a physical motion in the first second and shows, at a readable size (at least a third of the frame), either the product or the prop that leads to it."

[[judge]]
id = "sizes_named"
text = "Every shot where the product is visible says how big it is in frame; the hero fills at least half the frame."

[[judge]]
id = "no_cliche"
text = "No shot uses an idea from the run's own category-cliché list."

[[judge]]
id = "references_roles"
text = "Every prop that matters is a reference with a one-line physical description, a role and its shots; a prop is never described with the product's shape, colour or materials (a transforming prop may share one material, never the shape)."

[[judge]]
id = "sound_on_event"
text = "The audio line names one sound hit exactly on the key shot's event (the spray, the latch, the glass settling)."

[[judge]]
id = "emotion_on_turn"
text = "When the insight is about a person's feeling, the key shot shows that person's face, at least partly (profile or three-quarter is fine), and the face shows the feeling at the turn (a small private smile, a breath, softened eyes). 'Face turned away', 'seen from behind' or hands and a wrist alone at the key shot fail this rule: they turn the idea into a spray demo any brand could run. The cliche to avoid is 'eyes closed, sniffing the wrist', not showing her face."

[[judge]]
id = "culturally_gracious"
text = "No beat shows a host neglecting a guest, an elder or a parent, even for a moment: a ringing bell is answered, a guest at the door is never kept waiting, an elder is never ignored. In Saudi culture that reads as rude, not as self-care. A private moment happens before the guest needs her (one quick spray, a private smile, then she walks to the door with calm confidence)."

[[judge]]
id = "product_active"
text = "The product does something in the story in at least one shot: it is opened, poured or scooped from, handed over, asked for, chosen or used, and that action matters to the turn. A product that only stands on a table in every shot fails, and so does an action with no meaning (turning a pouch toward a cup). Example fix: the host scoops from the open pouch into the dallah, or the guest asks for the pouch."

[[judge]]
id = "physics_anchored"
text = "Every motion names what carries the weight (gripped between fingers, resting in the palm, standing on the tray), every spray, steam or smoke event says its visible size and direction, and the key event unfolds slowly in visible steps across its whole shot. Nothing hovers, nothing happens 'fast'."

[lessons]
try_1 = "One reference image only: the hostess held a red bottle with smoke instead of an incense burner, because nothing told the model what the burner looks like. 'Ember glow' became an open flame on the floor. 'Match cut' produced a crossfade with both objects on screen. The correct product was on screen 1.5 s of 8 (19 %), only as a still bottle at the end."
try_2 = "With the burner as Image 2 and roles in a References block, the props and the Saudi wardrobe were right. But the smoke-to-bottle morph lasted 0.5 s although the shot was planned at 2.5 s, the bottle floated above the palm, the spray in the last shot was invisible because the bottle was tiny, and the model cut the 2 s first shot to 1.2 s. The correct product was on screen 1.2 s of 9 (13 %)."
references = "Halai's product-review ad keeps the product on screen 93 % of the time and in a person's hands 54 %: lift, open, spray the wrist, smell with eyes closed. One location, one warm grade, a camera or a person moving every second. The Valentino reference cuts sound hits to its motion. Neither has an idea; we keep ours and borrow their execution."
try_3 = "Planning run run_01M6SSVMPBEAY1WW1FWF4DGWRZ (women's perfume, no video): the insight was the hostess who gives to everyone and reaches herself last, but the key shot showed only a hand and a wrist being sprayed: the ad read like a competitor's spray template and lost its own insight. The turn needs her face or body reacting (eyes close, a breath, a private smile). The writer also put the product's size in the action text ('a third') while the framing said 'half', and left a stray '}' in the audio line."
try_4 = "Planning re-run run_01M6SV0XZVPCFS6XA9HD7EE71M: the key shot had 'face turned away' and 'the bell rings again; she does not turn to the door'. Both fail: the face must show the feeling (profile or three-quarter), and a host who ignores a ringing bell reads as rude in Saudi culture. The fix: one quick spray, a private smile, then she walks to the door with calm confidence."
try_5 = "Coffee planning run run_01M6SVSK8GD53SYGZ8SF7AA9TT: the coffee pouch only stood on the tray in every shot, and the last shot's 'his hand turns the pouch toward the cup' was an action with no meaning. The product must do something that matters: the host scoops from the open pouch into the dallah, or the guest asks for the pouch."
try_6 = "Dates planning run run_01M6T075QBXT7VV9EW7K5V4MNC: no rule forbade faces, yet the concept said the grandmother's face must stay partial 'to avoid face-consistency problems', the storyboard framed 'no eyes or full face', the bible wrote 'her eyes are never shown', and the director kept her eyes out of frame 'as the bible requires'. Face consistency is a risk only across separate generations, not inside one; modesty is dress, not hiding a face. A woman's face in a headscarf may be fully visible."
