[project]
name = "adsmith"
version = "0.1.0"
description = "A marketing-ad agent with an explicit, typed, recoverable brain."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "anthropic>=0.70",
    "openai>=1.60",
    "fal-client>=0.5",
    "httpx>=0.27",
    "typer>=0.15",
    "rich>=13.9",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "pillow>=11.0",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.6",
    "python-ulid>=3.0",
]

[project.scripts]
adsmith = "adsmith.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.120",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adsmith"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs", "prompts"]  # markdown pseudo-code is not formatted

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH", "ASYNC", "BLE", "TRY", "RUF", "PL"]
ignore = [
    "TRY003",   # long messages in exception constructors are fine for typed errors
    "PLR0913",  # explicit keyword-heavy signatures are deliberate in providers
    "PLR2004",  # magic values are acceptable in tests and validators
    "RUF001", "RUF002", "RUF003",  # Arabic is a first-class language here, not a confusable
    "SIM905",   # word lists read better as a split string
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0915", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["fal_client.*", "arabic_reshaper.*", "bidi.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = ["live: hits real external APIs (opt-in with --live)"]
